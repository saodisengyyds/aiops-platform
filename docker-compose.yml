# ============================================================
#  智能运维平台（集群监控版）— Docker Compose 编排
#
#  目录约定：
#    /app        应用目录（docker-compose.yml、.env 所在）
#    /data       数据目录（MySQL 数据文件持久化于此）
#
#  用法：
#    mkdir -p /app /data
#    cd /app && cp .env.example .env && vi .env
#    docker compose up -d
# ============================================================

services:
  # ---------- 数据库（MySQL 8.4） ----------
  db:
    image: mysql:8.4
    container_name: aiops-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-aiops}
      MYSQL_USER: ${DB_USER:-aiops}
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
    volumes:
      # 数据持久化到 /data（宿主机本地目录，可直接查看/备份/迁移）
      - ${DATA_DIR:-/data}/mysql:/var/lib/mysql
    ports:
      # 只绑本机，不对外暴露数据库
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - aiops-net

  # ---------- 应用 ----------
  app:
    image: ${APP_IMAGE:-aiops:1.0.0}
    container_name: aiops-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8899
      HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-aiops}
      DB_USER: ${DB_USER:-aiops}
      DB_PASS: ${DB_PASS}
      DB_POOL: ${DB_POOL:-30}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_TTL: ${SESSION_TTL:-28800000}
      TZ: Asia/Shanghai
    ports:
      - "${APP_HOST_PORT:-8899}:8899"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8899/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - aiops-net

networks:
  aiops-net:
    driver: bridge
